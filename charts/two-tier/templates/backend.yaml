{{- $b := .Values.backend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    {{- include "two-tier.labels" . | nindent 4 }}
spec:
  replicas: {{ $b.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          # tag@digest when a digest is set: Kubernetes pulls by digest, the tag is just a label
          image: "{{ $b.image.repository }}:{{ $b.image.tag }}{{ with $b.image.digest }}@{{ . }}{{ end }}"
          ports:
            - containerPort: {{ $b.port }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ $b.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ $b.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend          # nginx proxies to http://backend:5000
  labels:
    app: backend
    {{- include "two-tier.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: {{ $b.port }}
      targetPort: {{ $b.port }}
