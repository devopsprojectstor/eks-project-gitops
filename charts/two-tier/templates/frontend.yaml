{{- $f := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "two-tier.labels" . | nindent 4 }}
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          # tag@digest when a digest is set: Kubernetes pulls by digest, the tag is just a label
          image: "{{ $f.image.repository }}:{{ $f.image.tag }}{{ with $f.image.digest }}@{{ . }}{{ end }}"
          ports:
            - containerPort: {{ $f.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $f.port }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $f.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "two-tier.labels" . | nindent 4 }}
spec:
  type: {{ $f.service.type }}
  selector:
    app: frontend
  ports:
    - port: {{ $f.service.port }}
      targetPort: {{ $f.port }}
